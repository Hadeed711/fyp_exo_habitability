<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Orbit Ring -->
  <ellipse cx="50" cy="50" rx="45" ry="15" transform="rotate(-30 50 50)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Back side of the ring -->
  <path d="M10 40 C 20 30, 80 30, 90 40" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.2" transform="rotate(-30 50 50)" />

  <!-- Planet Body -->
  <circle cx="50" cy="50" r="28" fill="url(#planetGradient)" filter="url(#glow)" />
  
  <!-- Surface Highlights -->
  <circle cx="42" cy="42" r="8" fill="white" fill-opacity="0.15" filter="blur(2px)" />
  <circle cx="60" cy="62" r="10" fill="black" fill-opacity="0.1" filter="blur(3px)" />

  <!-- Small Satellite/Moon -->
  <circle cx="85" cy="35" r="4" fill="#E2E8F0">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Front side of the ring -->
  <path d="M10 60 C 20 70, 80 70, 90 60" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" transform="rotate(-30 50 50)" />
</svg>
